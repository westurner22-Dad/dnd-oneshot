<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Lantern of Larkhollow</title>
<style>
  /* Dark-fantasy, phone-first. Everything is one column; buttons are big. */
  :root{--bg:#15110d;--card:#231b14;--ink:#eadfca;--dim:#a8977c;--gold:#d9a441;--ok:#6fbf73;--bad:#d9634f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Georgia,serif}
  main{max-width:560px;margin:auto;padding:12px}
  h1{font-size:1.25rem;color:var(--gold);margin:.2em 0} h2{font-size:1.1rem;margin:.2em 0;color:var(--gold)}
  .card{background:var(--card);border:1px solid #3a2d20;border-radius:12px;padding:12px;margin:10px 0}
  #turn{font-weight:bold;text-align:center;font-size:1.15rem;padding:14px}
  #turn.mine{background:#2f4a22;border-color:var(--ok)} #turn.wait{color:var(--dim)}
  button{display:block;width:100%;min-height:56px;margin:8px 0;font:inherit;font-size:1.05rem;color:var(--ink);
    background:#3b2a1a;border:2px solid var(--gold);border-radius:12px;padding:10px;text-align:left}
  button:disabled{opacity:.4;border-color:#555}
  .tag{float:right;color:var(--dim);font-size:.85rem}
  #roll{font-size:1.3rem;text-align:center} .ok{color:var(--ok)} .bad{color:var(--bad)}
  #party{display:flex;gap:6px} #party div{flex:1;font-size:.85rem;text-align:center;padding:6px;border-radius:8px;background:#1c1610}
  #party .now{outline:2px solid var(--gold)}
  #log{max-height:40vh;overflow:auto;font-size:.9rem} #log p{margin:.35em 0} #log .sc{color:var(--gold)}
  #links input{width:100%;font-size:.8rem;margin:3px 0;background:#1c1610;color:var(--ink);border:1px solid #444;padding:6px}
  #chat h2{margin-bottom:4px} #chatlog{max-height:28vh;overflow:auto;font-size:.9rem} #chatlog p{margin:.3em 0;overflow-wrap:anywhere}
  #chatlog time{color:var(--dim);font-size:.8rem}
  #chatform{display:flex;gap:6px} #chatin{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px;background:#1c1610;color:var(--ink);border:1px solid #555;border-radius:10px}
  #chatform button{width:auto;min-height:44px;margin:0;text-align:center;padding:0 14px}
</style></head>
<body><main>
  <h1>🏮 The Lantern of Larkhollow</h1>
  <div id="app"><p>Loading…</p></div>
  <section id="chat" class="card" hidden><h2>💬 Party chat</h2><div id="chatlog"></div>
    <form id="chatform"><input id="chatin" placeholder="Message the party…" autocomplete="off" enterkeyhint="send"><button>Send</button></form></section>
</main>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body></html>
